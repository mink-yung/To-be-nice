<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 실습</title>
    <link rel="stylesheet" href="./step5.css" />
</head>
<body>
    <h2>텍스트 스타일</h2>
    <div class="text-style">다양한 스타일의 텍스트</div>

    <h2>박스의 크기와 배경색</h2>
    <div class="box-style"></div>
    <div class="hex-style"></div>

    <h2>박스의 테두리</h2>
    <div class="box-border"></div>
    <br/>
    <div class="box-border dashed"></div>
    <br/>
    <div class="box-border dotted"></div>
    <br/>
    <div class="box-border double"></div>

    <h2>박스의 여백(패딩,마진)</h2>
    <div class="box-padding">패딩이 있는 박스</div>
    <div class="box-margin">마진이 있는 박스</div>

    <h2>박스 사이징</h2>
    <div class="content-box"></div>
    <div class="border-box"></div>

    <h2>블록과 인라인</h2>
    <div class="box-border box-inline">day1</div>
    <div class="box-border box-inline">day2</div>
    <div class="box-border box-inline">day3</div>
    <div class="box-border box-inline">day4</div>
    <br />
    <span class="box-block">span1</span>
    <span class="box-block">span2</span>
    <span>span3</span>
    <span>span4</span>
</body>
</html>
